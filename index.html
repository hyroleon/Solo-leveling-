<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Rotina Semanal • Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 8px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1f2937;
        }

        h2 {
            text-align: center;
            margin: 4px 0 6px;
            font-size: 1.3rem;
            color: #2563eb;
            letter-spacing: 0.3px;
        }

        /* Container da tabela ocupa 100% da largura disponível */
        .table-wrapper {
            width: 100%;
            overflow-x: hidden; /* sem barra horizontal */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            background: #fff;
            margin-bottom: 10px;
            flex: 1;
        }

        table {
            width: 100%;
            table-layout: fixed;           /* essencial para respeitar % */
            border-collapse: collapse;
            background: #fff;
            font-size: 11px;               /* base pequena para caber */
        }

        thead th {
            position: sticky;
            top: 0;
            background: #2563eb;
            color: #fff;
            z-index: 3;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 6px 2px;
            font-size: 0.65rem;
            text-align: center;
            word-break: keep-all;
        }

        th, td {
            border: 1px solid #e5e7eb;
            padding: 2px 1px;
            vertical-align: middle;
            height: 32px;
        }

        /* Larguras fixas por coluna (soma = 100%) */
        th:nth-child(1),
        td:nth-child(1) {
            width: 13%;          /* Hora */
        }

        th:nth-child(2),
        td:nth-child(2) { width: 11.5%; } /* Seg */
        th:nth-child(3),
        td:nth-child(3) { width: 11.5%; } /* Ter */
        th:nth-child(4),
        td:nth-child(4) { width: 11.5%; } /* Qua */
        th:nth-child(5),
        td:nth-child(5) { width: 11.5%; } /* Qui */
        th:nth-child(6),
        td:nth-child(6) { width: 11.5%; } /* Sex */
        th:nth-child(7),
        td:nth-child(7) { width: 11.5%; } /* Sáb */
        th:nth-child(8),
        td:nth-child(8) { width: 11.5%; } /* Dom */

        th:nth-child(9),
        td:nth-child(9) {
            width: 6.5%;         /* Ações */
            padding: 0;
        }

        /* Célula de horário */
        td.hora-cell {
            text-align: center;
            background: #f8fafc;
            font-weight: 700;
            color: #1e40af;
            font-size: 0.7rem;
            user-select: none;
            cursor: default;
        }

        /* Células editáveis */
        td[contenteditable] {
            cursor: text;
            background: #fff;
            transition: background 0.15s;
            word-break: break-word;
            font-size: 0.6rem;
            line-height: 1.2;
            text-align: center;
            overflow: hidden;
            white-space: normal;
        }

        td[contenteditable]:focus {
            outline: none;
            background: #dbeafe;
            box-shadow: inset 0 0 0 2px #2563eb;
            border-radius: 2px;
            position: relative;
            z-index: 2;
        }

        /* Célula de ações */
        td.acoes-cell {
            background: #fafafa;
            vertical-align: middle;
            text-align: center;
        }

        .acoes-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            height: 100%;
        }

        .btn-acao {
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 1px 2px;
            border-radius: 4px;
            transition: all 0.15s;
            line-height: 1;
            color: #4b5563;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            min-height: 16px;
        }

        .btn-acao.todos {
            font-size: 0.75rem;
            font-weight: bold;
        }

        .btn-acao.remover {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-acao:hover {
            background: #e0e7ff;
            border-color: #2563eb;
            color: #2563eb;
        }

        .btn-acao.remover:hover {
            background: #fee2e2;
            border-color: #dc2626;
            color: #dc2626;
        }

        .btn-acao.todos:hover {
            background: #d1fae5;
            border-color: #059669;
            color: #059669;
        }

        /* Grupo de botões inferior */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            padding: 0 4px;
        }

        .btn-group button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
            flex: 0 1 auto;
            min-width: 70px;
        }

        .btn-group button:active {
            transform: scale(0.96);
        }

        .btn-group button.danger {
            background: #dc2626;
        }

        .btn-group button.outline {
            background: #fff;
            color: #2563eb;
            border: 2px solid #2563eb;
        }

        .input-horario {
            padding: 8px 8px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.8rem;
            width: 90px;
            text-align: center;
            transition: border-color 0.2s;
            flex: 0 0 auto;
        }

        .input-horario:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Ajustes muito pequenos (ex: iPhone SE) */
        @media (max-width: 380px) {
            table {
                font-size: 9px;
            }
            td[contenteditable] {
                font-size: 0.5rem;
            }
            th {
                font-size: 0.5rem;
                padding: 3px 0;
            }
            td.hora-cell {
                font-size: 0.6rem;
            }
            .btn-acao {
                font-size: 0.6rem;
            }
            .btn-acao.todos {
                font-size: 0.65rem;
            }
            .btn-acao.remover {
                font-size: 0.7rem;
            }
            th:nth-child(1), td:nth-child(1) { width: 14%; }
            th:nth-child(2), td:nth-child(2) { width: 11%; }
            th:nth-child(3), td:nth-child(3) { width: 11%; }
            th:nth-child(4), td:nth-child(4) { width: 11%; }
            th:nth-child(5), td:nth-child(5) { width: 11%; }
            th:nth-child(6), td:nth-child(6) { width: 11%; }
            th:nth-child(7), td:nth-child(7) { width: 11%; }
            th:nth-child(8), td:nth-child(8) { width: 11%; }
            th:nth-child(9), td:nth-child(9) { width: 9%; }
            .input-horario {
                width: 75px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <h2>📅 Rotina Semanal</h2>

    <div class="table-wrapper">
        <table id="tabelaRotina">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Seg</th>
                    <th>Ter</th>
                    <th>Qua</th>
                    <th>Qui</th>
                    <th>Sex</th>
                    <th>Sáb</th>
                    <th>Dom</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Linhas geradas dinamicamente -->
            </tbody>
        </table>
    </div>

    <div class="btn-group">
        <input
        type="text"
        class="input-horario"
        id="inputNovoHorario"
        placeholder="Ex: 05h"
        maxlength="12"
        inputmode="text"
        >
        <button class="outline" onclick="adicionarNovoHorario()" title="Adiciona um novo horário">➕</button>
        <button onclick="salvarDados()" title="Salvar rotina">💾</button>
        <button class="danger" onclick="limparTudo()" title="Limpar toda a tabela">🗑️</button>
    </div>

    <script>
        (function() {
            const tbody = document.querySelector('#tabelaRotina tbody');
            const inputHorario = document.getElementById('inputNovoHorario');
            const STORAGE_KEY = 'rotinaSemanalMobile';

            const horariosExistentes = new Set();

            function extrairHoraNumerica(horario) {
                const match = horario.match(/(\d+)/);
                return match ? parseInt(match[1], 10) : Infinity;
            }

            function criarLinha(horario) {
                const tr = document.createElement('tr');
                tr.dataset.horario = horario;

                // Célula de horário
                const tdHora = document.createElement('td');
                tdHora.className = 'hora-cell';
                tdHora.textContent = horario;
                tr.appendChild(tdHora);

                // 7 dias editáveis
                for (let dia = 0; dia < 7; dia++) {
                    const td = document.createElement('td');
                    td.contentEditable = 'true';
                    td.dataset.hora = horario;
                    td.dataset.dia = dia;
                    td.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            this.blur();
                        }
                    });
                    tr.appendChild(td);
                }

                // Célula de ações
                const tdAcoes = document.createElement('td');
                tdAcoes.className = 'acoes-cell';
                const inner = document.createElement('div');
                inner.className = 'acoes-inner';

                const btnTodos = document.createElement('button');
                btnTodos.className = 'btn-acao todos';
                btnTodos.innerHTML = '↔️';
                btnTodos.title = 'Preencher todos os dias desta linha';
                btnTodos.addEventListener('click', () => preencherTodos(tr));
                inner.appendChild(btnTodos);

                const btnRemover = document.createElement('button');
                btnRemover.className = 'btn-acao remover';
                btnRemover.innerHTML = '✕';
                btnRemover.title = 'Remover esta linha';
                btnRemover.addEventListener('click', () => removerLinha(tr));
                inner.appendChild(btnRemover);

                tdAcoes.appendChild(inner);
                tr.appendChild(tdAcoes);

                return tr;
            }

            function inserirLinhaOrdenada(tr) {
                const horario = tr.dataset.horario;
                const horaNum = extrairHoraNumerica(horario);
                const linhas = Array.from(tbody.querySelectorAll('tr'));
                let inserido = false;

                for (let i = 0; i < linhas.length; i++) {
                    const hExistente = linhas[i].dataset.horario;
                    if (extrairHoraNumerica(hExistente) > horaNum) {
                        tbody.insertBefore(tr, linhas[i]);
                        inserido = true;
                        break;
                    }
                }
                if (!inserido) tbody.appendChild(tr);
                horariosExistentes.add(horario);
            }

            function removerLinha(tr) {
                const horario = tr.dataset.horario;
                if (!confirm(`Remover o horário "${horario}"?`)) return;
                horariosExistentes.delete(horario);
                tr.remove();
                salvarDados();
            }

            function preencherTodos(tr) {
                const horario = tr.dataset.horario;
                const textoAtual = tr.querySelector('td[contenteditable]')?.textContent.trim() || '';
                const texto = prompt(`Texto para todos os dias de ${horario}:`, textoAtual);
                if (texto === null) return;
                tr.querySelectorAll('td[contenteditable]').forEach(td => td.textContent = texto);
                salvarDados();
            }

            window.adicionarNovoHorario = function() {
                const valor = inputHorario.value.trim();
                if (!valor) {
                    alert('Digite um horário (ex: 05h, 23:30)');
                    inputHorario.focus();
                    return;
                }
                if (horariosExistentes.has(valor)) {
                    alert(`"${valor}" já existe.`);
                    inputHorario.select();
                    return;
                }
                const tr = criarLinha(valor);
                inserirLinhaOrdenada(tr);
                inputHorario.value = '';
                inputHorario.focus();
                salvarDados();
                tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
                tr.style.backgroundColor = '#fef3c7';
                setTimeout(() => tr.style.backgroundColor = '', 1200);
            };

            inputHorario.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    adicionarNovoHorario();
                }
            });

            function salvarDados() {
                const obj = {};
                document.querySelectorAll('#tabelaRotina tbody td[contenteditable]').forEach(td => {
                    const chave = `${td.dataset.hora}_${td.dataset.dia}`;
                    const valor = td.textContent.trim();
                    if (valor) obj[chave] = valor;
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
                const btnSalvar = document.querySelector('.btn-group button:nth-child(3)');
                if (btnSalvar && !btnSalvar.disabled) {
                    const original = btnSalvar.textContent;
                    btnSalvar.textContent = '✅';
                    btnSalvar.disabled = true;
                    setTimeout(() => {
                        btnSalvar.textContent = original;
                        btnSalvar.disabled = false;
                    }, 1000);
                }
            }
            window.salvarDados = salvarDados;

            function carregarDados() {
                const dados = localStorage.getItem(STORAGE_KEY);
                if (!dados) return;
                let obj;
                try { obj = JSON.parse(dados); } catch (e) { return; }
                document.querySelectorAll('#tabelaRotina tbody td[contenteditable]').forEach(td => {
                    const chave = `${td.dataset.hora}_${td.dataset.dia}`;
                    td.textContent = obj[chave] !== undefined ? obj[chave] : '';
                });
            }

            window.limparTudo = function() {
                if (!confirm('Apagar TODA a rotina? Essa ação é irreversível.')) return;
                document.querySelectorAll('#tabelaRotina tbody td[contenteditable]').forEach(td => td.textContent = '');
                salvarDados();
            };

            // Salvamento automático com debounce
            document.addEventListener('blur', function(e) {
                if (e.target.matches('#tabelaRotina tbody td[contenteditable]')) salvarDados();
            }, true);

            let timer;
            document.addEventListener('input', function(e) {
                if (e.target.matches('#tabelaRotina tbody td[contenteditable]')) {
                    clearTimeout(timer);
                    timer = setTimeout(salvarDados, 500);
                }
            });

            // Duplo clique na célula de hora para preencher todos
            tbody.addEventListener('dblclick', function(e) {
                if (e.target.classList.contains('hora-cell')) {
                    preencherTodos(e.target.parentElement);
                }
            });

            // Inicialização
            function inicializar() {
                const padrao = [];
                for (let h = 6; h <= 22; h++) padrao.push(h + 'h');
                padrao.forEach(horario => {
                    const tr = criarLinha(horario);
                    tbody.appendChild(tr);
                    horariosExistentes.add(horario);
                });
                carregarDados();
            }

            inicializar();
            console.log('✅ Rotina adaptada para mobile sem rolagem horizontal.');
        })();
    </script>
</body>
</html>
