<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dashboard — Rotina Previsível e Reordenável</title>
    <style>
        :root {
            --bg: #070b14;
            --bg-card: #0d1525;
            --border: #1a2740;
            --border-glow: #1e3050;
            --accent: #00c6e0;
            --accent-purple: #7b6cf6;
            --text: #dce3ed;
            --text-secondary: #8899b4;
            --text-muted: #5a6d84;
            --progress-bg: #141f30;
            --progress-fill: linear-gradient(90deg, #00c6e0, #7b6cf6);
            --shadow-glow: 0 0 30px rgba(0, 198, 224, 0.08);
            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(0, 198, 224, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 90%, rgba(123, 108, 246, 0.03) 0%, transparent 60%);
            background-attachment: fixed;
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image: linear-gradient(rgba(255,255,255,0.008) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.008) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        .app-container { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; padding: 16px 16px 100px; }

        .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); animation: logoPulse 4s infinite; }
        @keyframes logoPulse { 0%,100%{ box-shadow: 0 0 14px var(--accent); } 50%{ box-shadow: 0 0 22px var(--accent); } }
        .header-title { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.3px; color: var(--text); }
        .header-date, .header-time { font-size: 0.85rem; color: var(--text-secondary); font-family: var(--font-mono); background: var(--bg-card); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); }

        .progress-section { margin-bottom: 16px; background: var(--bg-card); border-radius: var(--radius); padding: 14px 18px; border: 1px solid var(--border); }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .progress-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .progress-percent { font-size: 1.3rem; font-weight: 700; color: var(--accent); font-family: var(--font-mono); }
        .progress-bar-outer { width: 100%; height: 8px; background: var(--progress-bg); border-radius: 10px; overflow: hidden; }
        .progress-bar-inner { height: 100%; background: var(--progress-fill); transition: width 0.5s; box-shadow: 0 0 12px rgba(0,198,224,0.3); }

        .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--bg-card); border-radius: var(--radius); padding: 5px; border: 1px solid var(--border); }
        .tab-btn { flex:1; padding: 10px 12px; border: none; background: transparent; color: var(--text-secondary); border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font); font-size: 0.85rem; transition: var(--transition); }
        .tab-btn.active { background: rgba(0,198,224,0.1); color: var(--accent); font-weight: 600; box-shadow: 0 0 0 1px rgba(0,198,224,0.3); }

        .panel { display: none; }
        .panel.active { display: block; animation: fadeSlideIn 0.3s ease; }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

        .block-card { background: var(--bg-card); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; }
        .block-card::before { content: ''; position: absolute; left:0; top:0; bottom:0; width:3px; border-radius:0 3px 3px 0; }
        .block-card.morning::before { background:#fbbf24; box-shadow:0 0 10px rgba(251,191,36,0.4); }
        .block-card.afternoon::before { background:#fb923c; box-shadow:0 0 10px rgba(251,146,60,0.4); }
        .block-card.night::before { background:#7b6cf6; box-shadow:0 0 10px rgba(123,108,246,0.4); }
        .block-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .block-title { font-size: 1rem; font-weight: 600; }
        .block-time-range { font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); }
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .task-item { display: flex; align-items: center; gap: 6px; padding: 8px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); border:1px solid transparent; }
        .task-item:hover { background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.04); }
        .custom-checkbox { width:22px; height:22px; border-radius:6px; border:2px solid var(--border-glow); display:flex; align-items:center; justify-content:center; transition:var(--transition); flex-shrink:0; }
        .task-item.checked .custom-checkbox { background:var(--accent); border-color:var(--accent); box-shadow:0 0 12px rgba(0,198,224,0.35); }
        .custom-checkbox svg { opacity:0; transform:scale(0.6); transition:var(--transition); width:12px; height:12px; }
        .task-item.checked .custom-checkbox svg { opacity:1; transform:scale(1); }
        .task-label { font-size:0.9rem; color:var(--text); flex:1; }
        .task-item.checked .task-label { color:var(--text-muted); text-decoration:line-through; }
        .task-time-badge { font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono); background:rgba(255,255,255,0.03); padding:3px 8px; border-radius:12px; white-space:nowrap; }
        .task-actions { display: flex; gap: 2px; margin-left: 2px; }
        .task-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 3px 5px; border-radius: 4px; font-size: 0.8rem; transition: var(--transition); display: flex; align-items: center; justify-content: center; min-width: 24px; }
        .task-action-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
        .task-action-btn:disabled { opacity: 0.3; pointer-events: none; }
        .add-task-btn { background: none; border: 1px dashed var(--border-glow); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.75rem; transition: var(--transition); margin-top: 8px; width: 100%; text-align: center; }
        .add-task-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,198,224,0.05); }

        .whatnow-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; gap: 16px; padding: 20px; }
        .whatnow-card { background: var(--bg-card); border-radius: var(--radius); padding: 32px 24px; border: 2px solid var(--accent); box-shadow: var(--shadow-glow); max-width: 400px; width: 100%; }
        .whatnow-label { font-size:0.75rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent); }
        .whatnow-task { font-size:1.6rem; font-weight:700; color:#fff; margin: 8px 0; }
        .whatnow-btn { margin-top:20px; padding:14px 32px; background:var(--accent); color:#070b14; border:none; border-radius:30px; font-weight:600; cursor:pointer; }

        .weekday-selector { display: flex; gap:4px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
        .weekday-btn { padding:9px 13px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); border-radius:22px; cursor:pointer; font-size:0.8rem; }
        .weekday-btn.active { background:rgba(123,108,246,0.15); border-color:var(--accent-purple); color:#fff; }

        .modal-overlay { position:fixed; inset:0; background:rgba(7,11,20,0.85); z-index:100; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); }
        .modal-overlay.hidden { display:none; }
        .modal-card { background:var(--bg-card); border-radius:var(--radius); padding:24px; max-width:400px; width:100%; border:1px solid var(--border); box-shadow:0 20px 50px rgba(0,0,0,0.6); }
        .modal-input { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:8px; margin-bottom:10px; font-family:var(--font); }
        .modal-btn { background:var(--accent); color:#070b14; border:none; padding:10px 20px; border-radius:20px; font-weight:600; cursor:pointer; margin-right:8px; }
        .modal-checkbox { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--text-secondary); font-size: 0.85rem; }
        .modal-checkbox input { accent-color: var(--accent); width: 16px; height: 16px; }

        .sos-btn { position:fixed; bottom:22px; right:20px; z-index:50; padding:12px 18px; background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.35); color:#fca5a5; border-radius:28px; cursor:pointer; }

        @media (max-width:480px) {
            .app-container { padding:10px 10px 100px; }
            .task-label { font-size:0.82rem; }
            .task-actions { gap: 0; }
            .task-action-btn { padding: 2px 3px; font-size: 0.7rem; min-width: 20px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-left"><div class="logo-dot"></div><span class="header-title">Meu Dashboard</span></div>
            <span class="header-date" id="headerDate"></span>
            <span class="header-time" id="headerTime"></span>
        </header>

        <section class="progress-section">
            <div class="progress-header"><span class="progress-label">📊 Progresso do dia</span><span class="progress-percent" id="progressPercent">0%</span></div>
            <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar" style="width:0%;"></div></div>
        </section>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="daily">📋 Diária (hoje)</button>
            <button class="tab-btn" data-tab="weekly">📅 Semanal</button>
            <button class="tab-btn" data-tab="whatnow">🎯 Agora?</button>
        </nav>

        <section class="panel active" id="panelDaily">
            <div class="block-card morning"><div class="block-header"><span>☀️</span><div><div class="block-title">Manhã</div><div class="block-time-range">06:00 — 12:00</div></div></div><ul class="task-list" id="dailyTaskListMorning"></ul><button class="add-task-btn" data-block="morning" data-context="daily">+ Adicionar tarefa</button></div>
            <div class="block-card afternoon"><div class="block-header"><span>🌤️</span><div><div class="block-title">Tarde</div><div class="block-time-range">12:00 — 18:00</div></div></div><ul class="task-list" id="dailyTaskListAfternoon"></ul><button class="add-task-btn" data-block="afternoon" data-context="daily">+ Adicionar tarefa</button></div>
            <div class="block-card night"><div class="block-header"><span>🌙</span><div><div class="block-title">Noite</div><div class="block-time-range">18:00 — 22:30</div></div></div><ul class="task-list" id="dailyTaskListNight"></ul><button class="add-task-btn" data-block="night" data-context="daily">+ Adicionar tarefa</button></div>
        </section>

        <section class="panel" id="panelWeekly">
            <div class="weekday-selector" id="weekdaySelector"></div>
            <div id="weeklyContent"></div>
        </section>

        <section class="panel" id="panelWhatnow"><div class="whatnow-container" id="whatnowContainer"></div></section>
    </div>

    <button class="sos-btn" id="sosBtn">🔄 Tudo deu errado</button>

    <div class="modal-overlay hidden" id="recoveryModal">
        <div class="modal-card"><div class="modal-icon">🧘</div><div class="modal-title">Plano de Volta</div><div id="recoverySteps"></div><button class="modal-close-btn" id="closeRecoveryBtn">Fechar</button></div>
    </div>

    <div class="modal-overlay hidden" id="taskModal">
        <div class="modal-card"><h3 id="taskModalTitle">Nova tarefa</h3>
            <input class="modal-input" id="taskNameInput" placeholder="Nome da tarefa">
            <input class="modal-input" id="taskTimeInput" placeholder="Horário (opcional)">
            <div class="modal-checkbox" id="applyAllCheckboxContainer">
                <input type="checkbox" id="applyAllCheckbox" checked> <label for="applyAllCheckbox">Aplicar a todos os dias da semana</label>
            </div>
            <button class="modal-btn" id="saveTaskBtn">Salvar</button>
            <button class="modal-btn" id="cancelTaskBtn" style="background:transparent; border:1px solid var(--border); color:var(--text);">Cancelar</button>
        </div>
    </div>

    <script>
        (function() {
            // ───────────────────────────────
            // DEFAULT DATA
            // ───────────────────────────────
            const DEFAULT_DAILY = {
                morning: [
                    { id: 'm1', label: 'Acordar e levantar', time: '06:00' },
                    { id: 'm2', label: 'Higiene pessoal', time: '06:15' },
                    { id: 'm3', label: 'Café da manhã', time: '06:45' },
                ],
                afternoon: [
                    { id: 'a1', label: 'Almoçar', time: '12:00' },
                    { id: 'a2', label: 'Descanso', time: '13:00' },
                ],
                night: [
                    { id: 'n1', label: 'Jantar', time: '18:30' },
                    { id: 'n2', label: 'Preparar para amanhã', time: '20:30' },
                    { id: 'n3', label: 'Dormir', time: '22:00' },
                ],
            };

            // ───────────────────────────────
            // STATE
            // ───────────────────────────────
            const STORAGE_KEY = 'meu_dashboard_v4';
            let weeklyTasks = {};
            let checkedTasks = {};
            let currentTab = 'daily';
            let selectedWeekday = new Date().getDay();
            let editingTask = null;

            // DOM refs
            const $headerDate = document.getElementById('headerDate');
            const $headerTime = document.getElementById('headerTime');
            const $progressPercent = document.getElementById('progressPercent');
            const $progressBar = document.getElementById('progressBar');
            const $panelDaily = document.getElementById('panelDaily');
            const $panelWeekly = document.getElementById('panelWeekly');
            const $panelWhatnow = document.getElementById('panelWhatnow');
            const $whatnowContainer = document.getElementById('whatnowContainer');
            const $weekdaySelector = document.getElementById('weekdaySelector');
            const $weeklyContent = document.getElementById('weeklyContent');
            const $recoveryModal = document.getElementById('recoveryModal');
            const $recoveryStepsContainer = document.getElementById('recoverySteps');
            const $taskModal = document.getElementById('taskModal');
            const $taskNameInput = document.getElementById('taskNameInput');
            const $taskTimeInput = document.getElementById('taskTimeInput');
            const $applyAllCheckbox = document.getElementById('applyAllCheckbox');
            const $applyAllCheckboxContainer = document.getElementById('applyAllCheckboxContainer');
            const $saveTaskBtn = document.getElementById('saveTaskBtn');
            const $cancelTaskBtn = document.getElementById('cancelTaskBtn');
            const $taskModalTitle = document.getElementById('taskModalTitle');

            function generateId() { return 't' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4); }

            // ───────────────────────────────
            // PERSISTENCE
            // ───────────────────────────────
            function loadAllData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        weeklyTasks = data.weeklyTasks || {};
                        checkedTasks = data.checkedTasks || {};
                    }
                } catch (e) {}
                for (let i = 0; i < 7; i++) {
                    if (!weeklyTasks[i]) {
                        weeklyTasks[i] = { tasks: JSON.parse(JSON.stringify(DEFAULT_DAILY)) };
                    } else {
                        for (const block of ['morning', 'afternoon', 'night']) {
                            if (!weeklyTasks[i].tasks[block]) weeklyTasks[i].tasks[block] = [];
                        }
                    }
                }
                const today = getTodayKey();
                if (!checkedTasks[today]) checkedTasks[today] = [];
            }
            function saveAllData() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ weeklyTasks, checkedTasks })); } catch(e) {}
            }
            function getTodayKey() {
                const d = new Date();
                return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            }

            // ───────────────────────────────
            // TASK HELPERS
            // ───────────────────────────────
            function getTasksForDay(dayIndex) {
                return weeklyTasks[dayIndex]?.tasks || { morning: [], afternoon: [], night: [] };
            }
            function getTodayTasks() { return getTasksForDay(new Date().getDay()); }
            function isTaskChecked(taskId) {
                const today = getTodayKey();
                return (checkedTasks[today] || []).includes(taskId);
            }
            function toggleTask(taskId) {
                const today = getTodayKey();
                if (!checkedTasks[today]) checkedTasks[today] = [];
                const idx = checkedTasks[today].indexOf(taskId);
                if (idx >= 0) checkedTasks[today].splice(idx,1);
                else checkedTasks[today].push(taskId);
                saveAllData();
                updateAllUI();
            }
            function getAllTodayTaskIds() {
                const tasks = getTodayTasks();
                const ids = [];
                for (const block of ['morning','afternoon','night']) {
                    for (const t of tasks[block]) ids.push(t.id);
                }
                return ids;
            }
            function calculateProgress() {
                const allIds = getAllTodayTaskIds();
                const today = getTodayKey();
                const checked = checkedTasks[today] || [];
                const done = allIds.filter(id => checked.includes(id)).length;
                const total = allIds.length;
                return { done, total, percent: total>0 ? Math.round((done/total)*100) : 0 };
            }
            function getNextTask() {
                const allIds = getAllTodayTaskIds();
                const today = getTodayKey();
                const checked = checkedTasks[today] || [];
                const tasks = getTodayTasks();
                for (const id of allIds) {
                    if (!checked.includes(id)) {
                        for (const block of ['morning','afternoon','night']) {
                            const found = tasks[block].find(t => t.id===id);
                            if (found) return { ...found, block };
                        }
                    }
                }
                return null;
            }

            // ───────────────────────────────
            // HELPER: find task index by id or fallback (label + time)
            // ───────────────────────────────
            function findTaskIndex(tasks, taskObj) {
                if (!taskObj) return -1;
                let idx = tasks.findIndex(t => t.id === taskObj.id);
                if (idx !== -1) return idx;
                // fallback for tasks with different IDs (created before fix)
                idx = tasks.findIndex(t => t.label === taskObj.label && t.time === taskObj.time);
                return idx;
            }

            // ───────────────────────────────
            // MOVE TASK
            // ───────────────────────────────
            function moveTask(block, taskObj, direction, dayIndex, context) {
                const targetDays = [];
                if (context === 'daily') {
                    const applyAll = confirm('Deseja aplicar essa mudança de ordem a TODOS os dias da semana?\n(OK = todos, Cancelar = apenas hoje)');
                    if (applyAll) {
                        for (let d = 0; d < 7; d++) targetDays.push(d);
                    } else {
                        targetDays.push(new Date().getDay());
                    }
                } else {
                    targetDays.push(dayIndex);
                }

                for (const d of targetDays) {
                    const tasks = weeklyTasks[d].tasks[block];
                    const idx = findTaskIndex(tasks, taskObj);
                    if (idx === -1) continue;
                    const newIdx = idx + direction;
                    if (newIdx < 0 || newIdx >= tasks.length) continue;
                    [tasks[idx], tasks[newIdx]] = [tasks[newIdx], tasks[idx]];
                }
                saveAllData();
                updateAllUI();
            }

            // ───────────────────────────────
            // RENDER DAILY
            // ───────────────────────────────
            function renderDailyTasks() {
                const today = new Date().getDay();
                const tasks = getTasksForDay(today);
                const blocks = [
                    { listEl: document.getElementById('dailyTaskListMorning'), block: 'morning' },
                    { listEl: document.getElementById('dailyTaskListAfternoon'), block: 'afternoon' },
                    { listEl: document.getElementById('dailyTaskListNight'), block: 'night' },
                ];
                for (const { listEl, block } of blocks) {
                    if (!listEl) continue;
                    listEl.innerHTML = '';
                    const blockTasks = tasks[block];
                    blockTasks.forEach((task, index) => {
                        const checked = isTaskChecked(task.id);
                        const li = document.createElement('li');
                        li.className = 'task-item' + (checked ? ' checked' : '');
                        const isFirst = index === 0;
                        const isLast = index === blockTasks.length - 1;
                        li.innerHTML = `
                            <div class="custom-checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                            <span class="task-label">${task.label}</span>
                            <span class="task-time-badge">${task.time || ''}</span>
                            <div class="task-actions">
                                <button class="task-action-btn move-up" data-id="${task.id}" data-block="${block}" ${isFirst ? 'disabled' : ''}>↑</button>
                                <button class="task-action-btn move-down" data-id="${task.id}" data-block="${block}" ${isLast ? 'disabled' : ''}>↓</button>
                                <button class="task-action-btn edit-daily-task" data-id="${task.id}" data-block="${block}">✎</button>
                                <button class="task-action-btn delete-daily-task" data-id="${task.id}" data-block="${block}">✕</button>
                            </div>`;
                        li.querySelector('.custom-checkbox').addEventListener('click', (e) => { e.stopPropagation(); toggleTask(task.id); });
                        li.querySelector('.move-up').addEventListener('click', (e) => { e.stopPropagation(); moveTask(block, task, -1, today, 'daily'); });
                        li.querySelector('.move-down').addEventListener('click', (e) => { e.stopPropagation(); moveTask(block, task, 1, today, 'daily'); });
                        li.querySelector('.edit-daily-task').addEventListener('click', (e) => { e.stopPropagation(); openTaskModal(block, task, today, 'daily'); });
                        li.querySelector('.delete-daily-task').addEventListener('click', (e) => { e.stopPropagation(); deleteTask(block, task, today, 'daily'); });
                        listEl.appendChild(li);
                    });
                }
            }

            // ───────────────────────────────
            // RENDER WEEKLY
            // ───────────────────────────────
            function renderWeekdaySelector() {
                const dayNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
                const today = new Date().getDay();
                $weekdaySelector.innerHTML = '';
                for (let i=0;i<7;i++) {
                    const btn = document.createElement('button');
                    btn.className = 'weekday-btn' + (i===selectedWeekday?' active':'') + (i===today?' today':'');
                    btn.textContent = dayNames[i];
                    btn.addEventListener('click', ()=>{ selectedWeekday=i; renderWeekdaySelector(); renderWeeklyContent(); });
                    $weekdaySelector.appendChild(btn);
                }
            }
            function renderWeeklyContent() {
                const tasks = getTasksForDay(selectedWeekday);
                let html = '';
                const blockLabels = ['☀️ Manhã','🌤️ Tarde','🌙 Noite'];
                const blockKeys = ['morning','afternoon','night'];
                for (let b=0; b<3; b++) {
                    const block = blockKeys[b];
                    html += `<div class="block-card ${block}"><div class="block-header"><span>${blockLabels[b].split(' ')[0]}</span><div><div class="block-title">${blockLabels[b].split(' ').slice(1).join(' ')}</div></div></div><ul class="task-list" id="weeklyTaskList-${block}"></ul><button class="add-task-btn" data-block="${block}" data-context="weekly">+ Adicionar</button></div>`;
                }
                $weeklyContent.innerHTML = html;
                for (const block of blockKeys) {
                    const listEl = document.getElementById('weeklyTaskList-'+block);
                    if (!listEl) continue;
                    listEl.innerHTML = '';
                    const blockTasks = tasks[block];
                    blockTasks.forEach((task, index) => {
                        const isFirst = index === 0;
                        const isLast = index === blockTasks.length - 1;
                        const li = document.createElement('li');
                        li.className = 'task-item';
                        li.innerHTML = `<span class="task-label">${task.label}</span><span class="task-time-badge">${task.time||''}</span>
                            <div class="task-actions">
                                <button class="task-action-btn move-up-weekly" data-id="${task.id}" data-block="${block}" ${isFirst ? 'disabled' : ''}>↑</button>
                                <button class="task-action-btn move-down-weekly" data-id="${task.id}" data-block="${block}" ${isLast ? 'disabled' : ''}>↓</button>
                                <button class="task-action-btn edit-weekly-task" data-id="${task.id}" data-block="${block}">✎</button>
                                <button class="task-action-btn delete-weekly-task" data-id="${task.id}" data-block="${block}">✕</button>
                            </div>`;
                        li.querySelector('.move-up-weekly').addEventListener('click', (e)=> { e.stopPropagation(); moveTask(block, task, -1, selectedWeekday, 'weekly'); });
                        li.querySelector('.move-down-weekly').addEventListener('click', (e)=> { e.stopPropagation(); moveTask(block, task, 1, selectedWeekday, 'weekly'); });
                        li.querySelector('.edit-weekly-task').addEventListener('click', (e)=> { e.stopPropagation(); openTaskModal(block, task, selectedWeekday, 'weekly'); });
                        li.querySelector('.delete-weekly-task').addEventListener('click', (e)=> { e.stopPropagation(); deleteTask(block, task, selectedWeekday, 'weekly'); });
                        listEl.appendChild(li);
                    });
                }
                document.querySelectorAll('#weeklyContent .add-task-btn').forEach(btn => {
                    btn.addEventListener('click', () => openTaskModal(btn.dataset.block, null, selectedWeekday, 'weekly'));
                });
            }

            // ───────────────────────────────
            // TASK MODAL & CRUD
            // ───────────────────────────────
            function openTaskModal(block, existingTask = null, dayIndex = null, context = 'daily') {
                editingTask = { block, task: existingTask, dayIndex, context };
                $taskModalTitle.textContent = existingTask ? 'Editar tarefa' : 'Nova tarefa';
                $taskNameInput.value = existingTask?.label || '';
                $taskTimeInput.value = existingTask?.time || '';
                if (context === 'daily') {
                    $applyAllCheckboxContainer.style.display = 'flex';
                    $applyAllCheckbox.checked = true;
                } else {
                    $applyAllCheckboxContainer.style.display = 'none';
                    $applyAllCheckbox.checked = false;
                }
                $taskModal.classList.remove('hidden');
                $taskNameInput.focus();
            }

            function saveTaskFromModal() {
                const label = $taskNameInput.value.trim();
                if (!label) return alert('Por favor, insira um nome para a tarefa.');
                const time = $taskTimeInput.value.trim();
                if (!editingTask) return;
                const { block, task: existingTask, dayIndex, context } = editingTask;
                const applyAll = (context === 'daily') ? $applyAllCheckbox.checked : false;

                if (context === 'daily' && applyAll) {
                    // Criar ou editar em todos os dias usando o mesmo ID para novas tarefas
                    let globalId = existingTask?.id || generateId();
                    for (let d = 0; d < 7; d++) {
                        const tasks = weeklyTasks[d].tasks[block];
                        if (existingTask) {
                            const idx = findTaskIndex(tasks, existingTask);
                            if (idx >= 0) {
                                tasks[idx].label = label;
                                tasks[idx].time = time;
                            }
                        } else {
                            tasks.push({ id: globalId, label, time });
                        }
                    }
                } else {
                    const targetDay = (context === 'daily') ? new Date().getDay() : dayIndex;
                    const tasks = weeklyTasks[targetDay].tasks[block];
                    if (existingTask) {
                        const idx = findTaskIndex(tasks, existingTask);
                        if (idx >= 0) {
                            tasks[idx].label = label;
                            tasks[idx].time = time;
                        }
                    } else {
                        tasks.push({ id: generateId(), label, time });
                    }
                }
                closeTaskModal();
                saveAllData();
                updateAllUI();
            }

            function deleteTask(block, taskObj, dayIndex, context) {
                if (!confirm('Remover esta tarefa?')) return;
                if (context === 'daily') {
                    const removeAll = confirm('Deseja remover esta tarefa de TODOS os dias da semana?\n(OK = todos, Cancelar = apenas hoje)');
                    if (removeAll) {
                        for (let d = 0; d < 7; d++) {
                            const tasks = weeklyTasks[d].tasks[block];
                            const idx = findTaskIndex(tasks, taskObj);
                            if (idx !== -1) tasks.splice(idx, 1);
                        }
                    } else {
                        const today = new Date().getDay();
                        const tasks = weeklyTasks[today].tasks[block];
                        const idx = findTaskIndex(tasks, taskObj);
                        if (idx !== -1) tasks.splice(idx, 1);
                    }
                } else {
                    const tasks = weeklyTasks[dayIndex].tasks[block];
                    const idx = findTaskIndex(tasks, taskObj);
                    if (idx !== -1) tasks.splice(idx, 1);
                }
                const todayKey = getTodayKey();
                if (checkedTasks[todayKey]) {
                    checkedTasks[todayKey] = checkedTasks[todayKey].filter(id => id !== taskObj.id);
                }
                saveAllData();
                updateAllUI();
            }

            function closeTaskModal() { $taskModal.classList.add('hidden'); editingTask = null; }

            // ───────────────────────────────
            // WHAT NOW
            // ───────────────────────────────
            function renderWhatNow() {
                const next = getNextTask();
                if (!next) {
                    $whatnowContainer.innerHTML = `<div class="whatnow-card"><div class="whatnow-label">🎯 O que faço agora?</div><div>🎉 Tudo concluído!</div></div>`;
                    return;
                }
                $whatnowContainer.innerHTML = `
                    <div class="whatnow-card">
                        <div class="whatnow-label">🎯 Próxima tarefa</div>
                        <div class="whatnow-task">${next.label}</div>
                        <div style="color:var(--text-muted);">⏰ ${next.time}</div>
                        <button class="whatnow-btn" id="whatnowCompleteBtn">✅ Concluir</button>
                    </div>`;
                document.getElementById('whatnowCompleteBtn').addEventListener('click', ()=>{
                    toggleTask(next.id);
                    renderWhatNow();
                    updateAllUI();
                });
            }

            // ───────────────────────────────
            // RECOVERY MODAL
            // ───────────────────────────────
            const recoverySteps = [
                'Pare tudo. Respire fundo 3 vezes.',
                'Beba um copo de água.',
                'Identifique o que deu errado (sem julgamento).',
                'Volte para a última tarefa concluída.',
                'Use o botão "🎯 Agora?" para ver a próxima.',
                'Peça ajuda se necessário.'
            ];
            let recoveryDone = [];
            function renderRecoverySteps() {
                $recoveryStepsContainer.innerHTML = '';
                recoverySteps.forEach((step, i) => {
                    const done = recoveryDone.includes(i);
                    const div = document.createElement('div');
                    div.className = 'recovery-step' + (done?' done':'');
                    div.innerHTML = `<span class="recovery-step-num">${done?'✓':i+1}</span><span>${step}</span>`;
                    div.addEventListener('click', ()=>{
                        if (!recoveryDone.includes(i)) recoveryDone.push(i);
                        else recoveryDone = recoveryDone.filter(x=>x!==i);
                        renderRecoverySteps();
                    });
                    $recoveryStepsContainer.appendChild(div);
                });
            }
            document.getElementById('sosBtn').addEventListener('click', ()=>{
                recoveryDone = [];
                renderRecoverySteps();
                $recoveryModal.classList.remove('hidden');
            });
            document.getElementById('closeRecoveryBtn').addEventListener('click', ()=>{
                $recoveryModal.classList.add('hidden');
            });

            // ───────────────────────────────
            // GLOBAL UPDATE
            // ───────────────────────────────
            function updateProgressUI() {
                const { percent } = calculateProgress();
                $progressPercent.textContent = percent + '%';
                $progressBar.style.width = percent + '%';
            }
            function updateDateTime() {
                const now = new Date();
                const days = ['Domingo','Segunda','Terça','Quarta','Qui','Sex','Sábado'];
                const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
                $headerDate.textContent = `${days[now.getDay()]}, ${now.getDate()} de ${months[now.getMonth()]} de ${now.getFullYear()}`;
                $headerTime.textContent = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
            }
            function updateAllUI() {
                updateProgressUI();
                renderDailyTasks();
                if (currentTab === 'weekly') { renderWeekdaySelector(); renderWeeklyContent(); }
                if (currentTab === 'whatnow') renderWhatNow();
                updateDateTime();
            }

            // ───────────────────────────────
            // TAB SWITCHING
            // ───────────────────────────────
            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                if (tab==='daily') { $panelDaily.classList.add('active'); renderDailyTasks(); }
                else if (tab==='weekly') { $panelWeekly.classList.add('active'); renderWeekdaySelector(); renderWeeklyContent(); }
                else if (tab==='whatnow') { $panelWhatnow.classList.add('active'); renderWhatNow(); }
                updateProgressUI();
            }
            document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', ()=> switchTab(btn.dataset.tab)));

            // ───────────────────────────────
            // EVENT LISTENERS
            // ───────────────────────────────
            $saveTaskBtn.addEventListener('click', saveTaskFromModal);
            $cancelTaskBtn.addEventListener('click', closeTaskModal);
            $taskModal.addEventListener('click', (e)=>{ if (e.target===$taskModal) closeTaskModal(); });
            document.addEventListener('keydown', (e)=>{ if (e.key==='Escape') { closeTaskModal(); if(!$recoveryModal.classList.contains('hidden')) $recoveryModal.classList.add('hidden'); } });

            document.querySelectorAll('#panelDaily .add-task-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const block = btn.dataset.block;
                    const today = new Date().getDay();
                    openTaskModal(block, null, today, 'daily');
                });
            });

            // Init
            loadAllData();
            updateDateTime();
            switchTab('daily');
            setInterval(updateDateTime, 10000);
            setInterval(saveAllData, 5000);
        })();
    </script>
</body>
</html>
